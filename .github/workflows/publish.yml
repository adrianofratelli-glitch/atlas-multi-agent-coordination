name: publish
# Constrói a imagem Docker da PoV e publica no GHCR (ghcr.io/adrianofratelli-glitch/atlas-multi-agent-coordination).
# Sem segredo além do GITHUB_TOKEN; .env nunca entra na imagem (.dockerignore).
# Gerado por _shared/workspace/ci/gerar_publish.py
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "nginx.conf"
      - "backend/**"
      - "frontend/**"
      - "requirements*"
      - "pyproject.toml"
      - "uv.lock"
      - "package*.json"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: tag curta do commit
        id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # amd64 + arm64: o `docker pull` funciona também em Mac Apple Silicon sem --platform
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/adrianofratelli-glitch/atlas-multi-agent-coordination:latest
            ghcr.io/adrianofratelli-glitch/atlas-multi-agent-coordination:${{ steps.tag.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/adrianofratelli-glitch/atlas-multi-agent-coordination
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
